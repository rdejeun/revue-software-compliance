name: Relevé des sources de veille

# Relève les publications des sources de référence (tools/sources.json) parues depuis la dernière édition et dépose le
# relevé dans veille/collecte/<date de l'édition>.md, que la routine lit en premier (README, § 3 et § 7).
# Exécuté sur les serveurs de GitHub : les flux bloqués dans les sessions de rédaction (versions GitHub) y sont lisibles.
# Calendrier : la veille de l'édition, le lundi à 18 h 47 UTC (20 h 47 en heure d'été à Paris, 19 h 47 en heure d'hiver) :
# le 13 octobre 2026, l'exécution programmée à 0 h 47 UTC n'a démarré qu'à 7 h 05, après la routine A. GitHub peut retarder ou omettre
# une exécution programmée : la routine lance alors tools/collecte.py elle-même (README, § 3). Le dossier veille/ ne
# déclenche pas la publication.

on:
  schedule:
    - cron: '47 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - name: Noter l’heure de lancement
        run: echo "LANCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relever les sources
        run: |
          # date de l'édition : le jour même le mardi, sinon le mardi suivant (lancement manuel)
          v=$(python3 -c "import datetime as d;t=d.date.today();print(t+d.timedelta(days=(1-t.weekday())%7))")
          t0=$(date +%s)
          python3 tools/collecte.py --sortie "veille/collecte/$v.md" 2> releve.log || { cat releve.log >&2; exit 1; }
          cat releve.log >&2
          echo "EDITION=$v" >> "$GITHUB_ENV"
          echo "DUREE=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
      - name: Journal des lancements (heure prévue, heure réelle, retard, durée)
        env:
          EVENEMENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF'
          import datetime as d, os, re
          f = 'veille/collecte/lancements.csv'
          lance = d.datetime.strptime(os.environ['LANCE'], '%Y-%m-%dT%H:%M:%SZ')
          prevu, retard = '', ''
          if os.environ['EVENEMENT'] == 'schedule' and os.environ.get('CRON'):
              mi, h = map(int, os.environ['CRON'].split()[:2])
              p = lance.replace(hour=h, minute=mi, second=0)
              if p > lance: p -= d.timedelta(days=1)   # lancé après minuit : prévu la veille
              prevu, retard = p.strftime('%Y-%m-%d %H:%M'), str(round((lance - p).total_seconds() / 60))
          log = open('releve.log', encoding='utf-8').read() if os.path.exists('releve.log') else ''
          m = re.search(r'(\d+) élément\(s\), (\d+) source\(s\) en échec', log)
          ligne = ';'.join([os.environ['EDITION'], os.environ['EVENEMENT'], prevu, lance.strftime('%Y-%m-%d %H:%M:%S'),
                            retard, os.environ['DUREE'], m[1] if m else '', m[2] if m else ''])
          neuf = not os.path.exists(f)
          with open(f, 'a', encoding='utf-8') as o:
              if neuf: o.write('edition;declenchement;prevu_utc;lance_utc;retard_min;duree_releve_s;candidats;sources_en_echec\n')
              o.write(ligne + '\n')
          print(ligne)
          s = os.environ.get('GITHUB_STEP_SUMMARY')
          if s: open(s, 'a').write(f'Lancement : {lance:%Y-%m-%d %H:%M:%S} UTC (prévu : {prevu or "lancement manuel"} ; retard : {retard or "—"} min) · relevé en {os.environ["DUREE"]} s\n')
          EOF
      - name: Enregistrer le relevé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille
          git diff --cached --quiet && exit 0
          git commit -m "Relevé des sources de veille"
          git pull --rebase origin main && git push origin HEAD:main
