name: Relevé des sources de veille

# Relève les publications des sources de référence (tools/sources.json) parues depuis la dernière édition et dépose le
# relevé dans veille/collecte/<date de l'édition>.md, que la routine lit en premier (README, § 3 et § 7).
# Exécuté sur les serveurs de GitHub : les flux bloqués dans les sessions de rédaction (versions GitHub) y sont lisibles.
# Calendrier : le mardi à 0 h 47 UTC (2 h 47 en heure d'été à Paris, 1 h 47 en heure d'hiver), minute « creuse » et marge d'une heure avant la routine, juste avant la routine. GitHub peut retarder ou omettre
# une exécution programmée : la routine lance alors tools/collecte.py elle-même (README, § 3). Le dossier veille/ ne
# déclenche pas la publication.

on:
  schedule:
    - cron: '47 0 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relever les sources
        run: |
          # date de l'édition : le jour même le mardi, sinon le mardi suivant (lancement manuel)
          v=$(python3 -c "import datetime as d;t=d.date.today();print(t+d.timedelta(days=(1-t.weekday())%7))")
          python3 tools/collecte.py --sortie "veille/collecte/$v.md"
      - name: Enregistrer le relevé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille
          git diff --cached --quiet && exit 0
          git commit -m "Relevé des sources de veille"
          git pull --rebase origin main && git push origin HEAD:main
