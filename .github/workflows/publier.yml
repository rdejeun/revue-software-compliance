name: Publier la revue

# Construit le site à partir de content/, contrôle la dernière édition, la met en ligne sur https://revue.dejeun.es/ puis
# envoie l'e-mail par Resend. Déclenché par chaque push sur main (fusion de la branche edition/AAAA-MM-JJ par la routine C)
# ou à la main. L'épisode audio n'est jamais produit ici : il l'est par le workflow « Studio », sur la branche de l'édition,
# après figeage du script (README, § 7, § 9 et § 11) ; la publication reprend l'épisode déjà enregistré.
# Mots-clés dans le message de commit : [brouillon] envoie seulement à DRAFT_TO ; [sans-envoi] n'envoie rien.
# [skip ci] (n'importe où dans le message, y compris en citation) : aucune exécution (rien n'est reconstruit ni mis en ligne).

on:
  push:
    branches: [main]
    paths: ['content/**', 'tools/**', '.github/workflows/publier.yml']
  workflow_dispatch:
    inputs:
      envoi:
        description: 'Envoi de l’e-mail'
        type: choice
        options: [auto, brouillon, diffusion, aucun]
        default: brouillon

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # une information dont la vérification est douteuse (affirmation non confirmée, extrait introuvable dans sa source lue deux fois)
      # est écartée de l'édition ; elle ne bloque jamais la publication (README, § 3). Non bloquant : en cas d'échec du script, la revue part telle quelle.
      - name: Écarter les informations non vérifiées (non bloquant)
        id: ecarter
        continue-on-error: true
        run: python3 tools/ecarter.py --appliquer

      # filet de sécurité : la répétition a déjà vérifié le même contenu ; si une page a changé entre-temps et qu'un élément
      # cité par le podcast est écarté, l'épisode (vérifié à la répétition) est conservé et une alerte est émise.
      - name: Alerte si un élément cité par l’épisode a été écarté
        if: steps.ecarter.outputs.podcast_a_relire == '1'
        run: echo "::warning title=Épisode audio::Un élément cité par l’épisode a été écarté à la publication ; l’épisode, vérifié à la répétition, est conservé. Voir veille/ecartes/."

      - name: Épisode présent ?
        run: |
          d=$(ls content | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)
          if [ -f "content/$d/podcast.json" ] && [ ! -f "content/$d/episode.m4a" ]; then
            echo "::warning title=Épisode audio::L’édition $d est publiée sans épisode (workflow « Studio » non terminé ou en échec)."
          fi

      # version imprimable (README, § 18) : PDF de 4 pages A4 et A3 imposé ; jamais bloquante
      - name: Bibliothèques de la version imprimable (non bloquant)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 > /dev/null || true
          pip install -q weasyprint==70.0 pypdf==5.9.0 qrcode==8.2

      - name: Versions imprimables déjà produites (cache)
        uses: actions/cache@v4
        with:
          path: build/pdf-cache
          key: pdf-${{ github.run_id }}
          restore-keys: pdf-

      - name: Construire le site et les e-mails
        run: python3 tools/build_site.py

      - name: Contrôler la dernière édition (bloquant)
        run: python3 tools/validate.py

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4

      - name: Choisir le mode d’envoi
        id: mode
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          SAISIE: ${{ github.event.inputs.envoi }}
        run: |
          if [ -n "$SAISIE" ]; then m="$SAISIE"
          elif printf '%s' "$MESSAGE" | grep -qi '\[sans-envoi\]'; then m=aucun
          elif printf '%s' "$MESSAGE" | grep -qi '\[brouillon\]'; then m=brouillon
          else m=auto; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "Mode d’envoi : $m"

      - name: Envoyer l’e-mail
        id: envoi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          DRAFT_TO: ${{ vars.DRAFT_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python3 tools/send.py --mode "${{ steps.mode.outputs.mode }}" --wait

      - name: Enregistrer l’envoi et les informations écartées
        if: steps.envoi.outputs.sent == '1' || steps.ecarter.outputs.ecartes == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content veille/ecartes veille/imprimable
          git diff --cached --quiet && exit 0
          msg="Envoi enregistré [skip ci]"
          [ "${{ steps.envoi.outputs.sent }}" != '1' ] && msg="[skip ci]"
          [ "${{ steps.ecarter.outputs.ecartes }}" = '1' ] && msg="Informations écartées de l’édition, $msg"
          git commit -m "$msg"
          git pull --rebase origin main && git push origin HEAD:main
