name: Illustrations

# Dessins de presse de la version imprimable (README, § 18) : à partir des briefs de content/<date>/illustrations.json,
# tools/illustrer.py demande à Recraft des dessins vectoriels au trait (clé RECRAFT_API_KEY, secret du dépôt ; 0,08 $ par
# image) et dépose les candidats dans veille/illustrations/<date>/, que la rédaction regarde avant d'en retenir un par
# brief. Lancement manuel (avec ses réglages), ou push d'une branche illustrations/<date> (réglages par défaut : un
# candidat par brief, 0,70 $ au plus) ou de la branche edition/<date> de la routine A (mêmes réglages ; un brief déjà servi
# n'est pas redemandé) ; les candidats (SVG et aperçu PNG) sont versés sur la branche poussée (ou sur main au lancement manuel).

on:
  push:
    branches: ['illustrations/**', 'edition/**']
    paths: ['content/**/illustrations.json', 'tools/illustrer.py', '.github/workflows/illustrations.yml']
  workflow_dispatch:
    inputs:
      date:
        description: 'Édition (AAAA-MM-JJ)'
        required: true
      candidats:
        description: 'Candidats par brief'
        default: '1'
      seulement:
        description: 'Identifiants de briefs, séparés par des virgules (vide : tous)'
        default: ''
      modele:
        description: 'Modèle Recraft'
        default: 'recraftv3_vector'
      style:
        description: 'Style Recraft'
        default: 'Line art'
      budget:
        description: 'Budget maximal ($)'
        default: '1.5'

permissions:
  contents: write

jobs:
  dessiner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg==2.7.1
      - name: Demander les dessins
        env:
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
        run: |
          d="${{ inputs.date }}"; [ -z "$d" ] && d="${GITHUB_REF_NAME#*/}"
          python3 tools/illustrer.py "$d" --candidats "${{ inputs.candidats || '1' }}" --seulement "${{ inputs.seulement }}" \
            --modele "${{ inputs.modele || 'recraftv3_vector' }}" --style "${{ inputs.style || 'Line art' }}" --budget "${{ inputs.budget || '0.7' }}"
          echo "EDITION=$d" >> "$GITHUB_ENV"
      - name: Enregistrer les candidats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille/illustrations
          git diff --cached --quiet && exit 0
          git commit -m "Illustrations $EDITION : candidats [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
