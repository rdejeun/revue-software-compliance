name: Illustrations

# Dessins de presse de la version imprimable (README, § 18) : à partir des briefs de content/<date>/illustrations.json,
# tools/illustrer.py demande à Recraft des dessins vectoriels au trait (clé RECRAFT_API_KEY, secret du dépôt ; 0,08 $ par
# image) et dépose les candidats dans veille/illustrations/<date>/, que la rédaction regarde avant d'en retenir un par
# brief. Lancement manuel seulement ; le dossier veille/ ne déclenche pas la publication.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Édition (AAAA-MM-JJ)'
        required: true
      candidats:
        description: 'Candidats par brief'
        default: '1'
      seulement:
        description: 'Identifiants de briefs, séparés par des virgules (vide : tous)'
        default: ''
      modele:
        description: 'Modèle Recraft'
        default: 'recraftv3_vector'
      style:
        description: 'Style Recraft'
        default: 'Line art'
      budget:
        description: 'Budget maximal ($)'
        default: '1.5'

permissions:
  contents: write

jobs:
  dessiner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Demander les dessins
        env:
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
        run: |
          python3 tools/illustrer.py "${{ inputs.date }}" --candidats "${{ inputs.candidats }}" --seulement "${{ inputs.seulement }}" \
            --modele "${{ inputs.modele }}" --style "${{ inputs.style }}" --budget "${{ inputs.budget }}"
      - name: Enregistrer les candidats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille/illustrations
          git diff --cached --quiet && exit 0
          git commit -m "Illustrations ${{ inputs.date }} : candidats [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
