name: Répétition de l’édition

# Répétition générale d'une édition poussée sur une branche edition/AAAA-MM-JJ par la routine A (ou B) : mêmes contrôles
# que la publication, exécutés sur le serveur (qui lit les pages GitHub), et chaîne audio essayée à blanc avec des voix
# synthétiques. Ne publie rien, n'envoie rien, n'appelle ElevenLabs que pour lire le solde (gratuit) : aucun caractère consommé.
# Résultat : veille/repetition/AAAA-MM-JJ.json et .md enregistrés sur la branche, et statut « Répétition » sur le commit répété
# (vérifié par le workflow « Studio » avant toute production). README, § 7 et § 9.

on:
  push:
    branches: ['edition/**']   # sans filtre de chemins : le premier push d'une branche neuve doit toujours déclencher la répétition
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: repetition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repetition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # un push qui ne touche que le figeage ou l'épisode (déclenche « Studio ») ou des rapports n'appelle pas de répétition
      - name: Répétition nécessaire ?
        id: besoin
        env:
          AVANT: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != push ] || [ -z "$AVANT" ] || [ "$AVANT" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then echo "oui=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          autres=$(git diff --name-only "$AVANT" "${{ github.sha }}" | grep -E '^(content|tools)/' | grep -vE '^content/[^/]+/(podcast\.fige\.json|episode\.)' || true)
          if [ -n "$autres" ]; then echo "oui=1" >> "$GITHUB_OUTPUT"; else echo "oui=0" >> "$GITHUB_OUTPUT"; echo "Rien à répéter : ni content/ ni tools/ modifiés hors figeage et épisode."; fi

      - name: Statut « en cours »
        if: steps.besoin.outputs.oui == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context="Répétition" -f description="Répétition en cours" > /dev/null

      - name: ffmpeg, bibliothèques audio (essai à blanc) et version imprimable
        if: steps.besoin.outputs.oui == '1'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $A update -q && sudo apt-get $A install -y -q ffmpeg libpango-1.0-0 libpangoft2-1.0-0 | grep -E '^(Err|W:|E:)|newly installed' || true
          pip install -q numpy scipy soundfile pyloudnorm pedalboard faster-whisper==1.2.1
          pip install -q weasyprint==70.0 pypdf==5.9.0 qrcode==8.2 || true   # version imprimable (README, § 18)

      - name: Modèle de transcription en cache
        if: steps.besoin.outputs.oui == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Répéter l’édition (contrôle, aperçu des écarts, podcast à blanc, solde)
        if: steps.besoin.outputs.oui == '1'
        id: rep
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # lecture du solde seulement (/v1/user/subscription)
        run: python3 tools/repetition.py

      - name: Conserver l’essai à blanc (7 jours)
        if: always() && steps.besoin.outputs.oui == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: repetition
          path: |
            build/podcast/
            build/repetition/
          retention-days: 7
          if-no-files-found: ignore

      - name: Enregistrer le rapport sur la branche
        if: steps.besoin.outputs.oui == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille/repetition veille/imprimable   # version papier produite ici, réutilisée à la publication
          git diff --cached --quiet && exit 0
          git commit -m "Répétition ${{ steps.rep.outputs.verdict }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done

      - name: Statut final
        if: always() && steps.besoin.outputs.oui == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.rep.outputs.verdict }}
          RESUME: ${{ steps.rep.outputs.resume }}
        run: |
          if [ "$VERDICT" = verte ]; then s=success; d="Répétition verte"; else s=failure; d="${RESUME:-Répétition interrompue}"; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=$s -f context="Répétition" -f description="${d:0:140}" > /dev/null
          echo "Répétition : $s ($d)"
