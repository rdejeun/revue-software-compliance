name: Essai audio

# Produit les versions d'un essai d'écoute (tools/essais/*.json) avec la chaîne complète du podcast,
# puis les enregistre dans essais/sorties/ sur la même branche. Ne touche à aucune édition, n'envoie rien.
# Déclenché par un push sur une branche essai-* qui modifie tools/essais/.

on:
  push:
    branches: ['essai-*']
    paths: ['tools/essais/**']

permissions:
  contents: write

concurrency:
  group: essai-audio
  cancel-in-progress: false

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ffmpeg et bibliothèques audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy scipy soundfile pyloudnorm pedalboard faster-whisper==1.2.1

      - name: Modèle de transcription en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Produire les versions de l’essai
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_FEMALE: ${{ vars.ELEVENLABS_VOICE_FEMALE }}
          ELEVENLABS_VOICE_MALE: ${{ vars.ELEVENLABS_VOICE_MALE }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          ls tools/essais/*.json > /tmp/essais.txt
          cat /tmp/essais.txt
          python3 tools/podcast.py --essai $(cat /tmp/essais.txt)

      - name: Enregistrer les sorties sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essais/sorties
          git diff --cached --quiet && exit 0
          git commit -m "Essai audio : sorties [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
